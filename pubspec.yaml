name: tabibi_mobile
description: Application mobile Tabibi (iOS + Android) — Flutter.
publish_to: "none"
version: 0.15.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:           # delegues Material / Cupertino pour fr, ar (RTL) et en
    sdk: flutter
  http: ^1.2.2
  supabase_flutter: ^2.8.0        # auth + acces direct a la base (Supabase)
  intl: ^0.20.3                    # dates et mois selon la locale courante (DateFormat)
  shared_preferences: ^2.3.0       # memorisation de la langue choisie par l'utilisateur
  flutter_secure_storage: ^9.2.2 # stockage sur du jeton
  url_launcher: ^6.3.0           # ouverture du lien de salle (teleconsultation) dans le navigateur (repli)
  webview_flutter: ^4.7.0        # teleconsultation embarquee dans l'app (salle Daily)
  webview_flutter_android: ^3.16.0 # gestion permissions camera/micro dans la WebView Android
  path_provider: ^2.1.4          # dossier temporaire ou est ecrit le PDF d'une ordonnance
  open_filex: ^4.5.0             # ouverture du PDF avec l'application du telephone
  permission_handler: ^11.3.1    # demande runtime camera/micro (teleconsultation)
  flutter_svg: ^2.0.10           # logo SVG Tabibi
  flutter_map: ^8.3.2
  file_picker: ^8.1.2        # upload documents (verification medecin)
  latlong2: ^0.10.1
  # --- Push/FCM (INACTIF) : decommenter APRES avoir depose android/app/google-services.json ---
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
