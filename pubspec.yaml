name: tabibi_mobile
description: Application mobile Tabibi (iOS + Android) — Flutter.
publish_to: "none"
version: 0.15.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:           # delegues Material / Cupertino pour fr, ar (RTL) et en
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.3                    # dates et mois selon la locale courante (DateFormat)
  shared_preferences: ^2.3.0       # memorisation de la langue choisie par l'utilisateur
  flutter_appauth: ^8.0.0        # OAuth2/OIDC (Keycloak) natif iOS + Android
  flutter_secure_storage: ^9.2.2 # stockage sur du jeton
  url_launcher: ^6.3.0           # ouverture du lien de salle (teleconsultation) dans le navigateur
  path_provider: ^2.1.4          # dossier temporaire ou est ecrit le PDF d'une ordonnance
  open_filex: ^4.5.0             # ouverture du PDF avec l'application du telephone
  flutter_svg: ^2.0.10           # logo SVG Tabibi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
