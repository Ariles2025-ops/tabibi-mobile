name: tabibi_mobile
description: Application mobile Ndawik (iOS + Android) — Flutter.
publish_to: "none"
version: 0.18.1+10

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:          # textes Material en francais et en arabe, sens RTL
    sdk: flutter
  http: ^1.2.2
  flutter_appauth: ^8.0.0        # OAuth2/OIDC (Keycloak) natif iOS + Android
  flutter_secure_storage: ^9.2.2 # stockage sur du jeton
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2     # langue choisie, memorisee sur le telephone           # ouverture du lien de salle (teleconsultation) dans le navigateur

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/logo-ndawik.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Arabe (licence OFL, assets/fonts/OFL-IBMPlexSansArabic.txt) : fichiers officiels IBM Plex Sans Arabic.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
