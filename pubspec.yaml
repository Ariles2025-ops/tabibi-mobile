name: tabibi_mobile
description: Application mobile Tabibi (iOS + Android) — Flutter.
publish_to: "none"
version: 0.13.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_appauth: ^8.0.0        # OAuth2/OIDC (Keycloak) natif iOS + Android
  flutter_secure_storage: ^9.2.2 # stockage sur du jeton
  url_launcher: ^6.3.0           # ouverture du lien de salle (teleconsultation) dans le navigateur

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
