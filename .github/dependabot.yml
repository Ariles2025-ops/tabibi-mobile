# Mises a jour de dependances hebdomadaires (pull requests a verifier par la CI : analyse, tests, build).
version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    # Pas de changement de version majeure automatique avant le lancement (ils cassaient les tests et envoyaient des e-mails d'échec).
    # Les failles connues restent surveillées par Trivy (Securite) ; une version majeure se fait à la main, sur décision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    # Pas de changement de version majeure automatique avant le lancement (ils cassaient les tests et envoyaient des e-mails d'échec).
    # Les failles connues restent surveillées par Trivy (Securite) ; une version majeure se fait à la main, sur décision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Pas de changement de version majeure automatique avant le lancement (ils cassaient les tests et envoyaient des e-mails d'échec).
    # Les failles connues restent surveillées par Trivy (Securite) ; une version majeure se fait à la main, sur décision.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
