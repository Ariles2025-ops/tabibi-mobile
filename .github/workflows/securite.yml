# Agent sécurité : secrets oubliés dans le code (Gitleaks) et failles connues dans les dépendances (Trivy).
# Tourne à chaque PR, à chaque push sur main et chaque lundi. Échoue seulement sur un secret ou une faille CRITIQUE corrigeable.
name: Securite
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recherche de secrets dans tout l'historique
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner -v
  dependances:
    name: Failles connues (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rapport (failles HAUTES et CRITIQUES)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
      - name: Blocage (failles CRITIQUES corrigeables)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true
